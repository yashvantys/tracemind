services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tracemind-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tracemind

    ports:
      - "5434:5432"

    volumes:
      - tracemind_pgdata:/var/lib/postgresql/data

volumes:
  tracemind_pgdata: